<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Methane (CH4)</title>
<script src="https://cdn.jsdelivr.net/npm/3dmol/build/3Dmol-min.js"></script>
<style>
  :root {
    --bg: #0e1210;
    --text: #e8eae6;
    --muted: #9aa09b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  #viewer {
    flex: 1;
    width: 100%;
  }
  .caption {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 6px 0;
    background: var(--bg);
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="viewer"></div>
  <div class="caption">Methane (CH₄) — drag to rotate, scroll to zoom</div>
</div>

<script>
  const xyz = `5
Methane
C   0.0000   0.0000   0.0000
H   0.6297   0.6297   0.6297
H  -0.6297  -0.6297   0.6297
H  -0.6297   0.6297  -0.6297
H   0.6297  -0.6297  -0.6297`;

  window.addEventListener("DOMContentLoaded", function () {
    const viewer = $3Dmol.createViewer("viewer", { backgroundColor: "#0e1210" });
    viewer.addModel(xyz, "xyz");
    viewer.setStyle({}, {
      stick: { radius: 0.08, colorscheme: "Jmol" },
      sphere: { scale: 0.28, colorscheme: "Jmol" }
    });
    viewer.zoomTo();
    viewer.render();
  });
</script>
</body>
</html>
