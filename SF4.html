<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sulfur tetrachloride (SCl4)</title>
<script src="https://cdn.jsdelivr.net/npm/3dmol/build/3Dmol-min.js"></script>
<style>
  :root {
    --bg: #0e1210;
    --text: #e8eae6;
    --muted: #9aa09b;
    --accent: #5a9873;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
  }
  #viewer {
    flex: 1;
    width: 100%;
    position: relative;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 12px;
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    min-height: 40px;
    border-top: 1px solid #2a2f2c;
  }
  #readout { color: var(--text); }
  #readout.hint { color: var(--muted); }
  button {
    background: transparent;
    color: var(--text);
    border: 1px solid #3a403c;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button:hover { background: #1d2220; }
  .caption {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 0 0 6px 0;
    background: var(--bg);
  }
  @media (max-width: 600px) {
    .bar { font-size: 1.05rem; }
    button { font-size: 0.95rem; padding: 8px 14px; }
    .caption { font-size: 0.85rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="viewer"></div>
  <div class="bar">
    <span id="readout" class="hint">Click two atoms for a bond length, or three atoms for an angle (the second atom you click is the vertex).</span>
    <button id="clearBtn">Clear</button>
  </div>
  <div class="caption">Sulfur tetrachloride (SCl₄) — drag to rotate, scroll to zoom</div>
</div>

<script>
  // Illustrative seesaw geometry (not experimental).
  const xyz = `5
Sulfur tetrachloride
S     0.0000    0.0000    0.0000
Cl    0.4791    2.0167    0.5710
Cl   -0.2550   -2.0167   -0.7004
Cl    1.8685   -0.5433    0.6450
Cl    0.3757    0.5433   -1.9407`;

  let viewer;
  let picked = [];
  // label text size in px: larger on phones / touch screens
  const LABEL_FONT = (window.matchMedia("(pointer: coarse)").matches || window.innerWidth < 600) ? 24 : 16;

  function applyStyles() {
    viewer.setStyle({}, { stick: { radius: 0.08, colorscheme: "Jmol" } });
    viewer.setStyle({ elem: "S" }, {
      stick: { radius: 0.08, colorscheme: "Jmol" },
      sphere: { scale: 0.40, colorscheme: "Jmol" }
    });
    viewer.setStyle({ elem: "Cl" }, {
      stick: { radius: 0.08, colorscheme: "Jmol" },
      sphere: { scale: 0.55, colorscheme: "Jmol" }
    });
  }

  function setReadout(text, isHint) {
    const el = document.getElementById("readout");
    el.textContent = text;
    el.className = isHint ? "hint" : "";
  }

  function clearMeasurement() {
    picked = [];
    redraw();
  }

  function vec(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
  function dot(u, v) { return u.x * v.x + u.y * v.y + u.z * v.z; }
  function norm(u) { return Math.sqrt(dot(u, u)); }

  const HALO_SCALE = { S: 0.40, Cl: 0.55 };  // keep in sync with applyStyles
  const HINT = "Click two atoms for a bond length, or three atoms for an angle (the second atom you click is the vertex).";

  // Optional extra display on the central atom, pointing opposite the sum of the bond vectors
  const LONE_PAIR_ATOM = "S";
  let showLonePair = false;
  const LONE_PAIR_KEY = "l";   // press this key (page must have focus) to toggle
  function drawLonePair() {
    if (!showLonePair) return;
    const atoms = viewer.selectedAtoms({});
    const c = atoms.find(function (a) { return a.elem === LONE_PAIR_ATOM; });
    if (!c) return;
    let dx = 0, dy = 0, dz = 0;
    atoms.forEach(function (a) { if (a !== c) { dx += a.x - c.x; dy += a.y - c.y; dz += a.z - c.z; } });
    const L = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
    const ux = -dx / L, uy = -dy / L, uz = -dz / L;
    // two overlapping spheres give a lobe that is narrow near the nucleus and wider away from it
    [[0.50, 1.55], [1.20, 0.95]].forEach(function (s) {
      viewer.addSphere({
        center: { x: c.x + ux * s[0], y: c.y + uy * s[0], z: c.z + uz * s[0] },
        radius: s[1],
        color: "#a8ccff",
        alpha: 0.6
      });
    });
  }

  // Redraw halos, dashed lines, labels and readout from the current picked list
  function redraw() {
    viewer.removeAllLabels();
    viewer.removeAllShapes();
    drawLonePair();

    picked.forEach(function (atom, i) {
      const vdw = ($3Dmol.vdwRadii && $3Dmol.vdwRadii[atom.elem]) || 1.7;
      viewer.addSphere({
        center: { x: atom.x, y: atom.y, z: atom.z },
        radius: vdw * (HALO_SCALE[atom.elem] || 0.30) + 0.15,
        color: "yellow",
        alpha: 0.35
      });
      if (i > 0) {
        const p = picked[i - 1];
        viewer.addLine({
          start: { x: p.x, y: p.y, z: p.z },
          end: { x: atom.x, y: atom.y, z: atom.z },
          color: "yellow",
          dashed: true
        });
      }
    });

    if (picked.length === 0) {
      setReadout(HINT, true);
    } else if (picked.length === 1) {
      setReadout("Selected " + picked[0].elem + ". Click a second atom for a distance, then a third for an angle. Click a selected atom again to deselect it.", true);
    } else if (picked.length === 2) {
      const a = picked[0], b = picked[1];
      const d = norm(vec(a, b));
      viewer.addLabel((100 * d).toFixed(1) + " pm", {
        position: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: (a.z + b.z) / 2 },
        backgroundColor: "black",
        backgroundOpacity: 0.7,
        fontColor: "yellow",
        fontSize: LABEL_FONT,
        bold: true
      });
      setReadout(a.elem + "–" + b.elem + " distance = " + (100 * d).toFixed(1) + " pm  (click a third atom to measure the angle at the second atom)", false);
    } else {
      const a = picked[0], b = picked[1], c = picked[2];
      const v1 = vec(a, b), v2 = vec(c, b);
      const cosT = dot(v1, v2) / (norm(v1) * norm(v2));
      const deg = Math.acos(Math.max(-1, Math.min(1, cosT))) * 180 / Math.PI;

      // place label slightly off the vertex, along the bisector
      const u1 = { x: v1.x / norm(v1), y: v1.y / norm(v1), z: v1.z / norm(v1) };
      const u2 = { x: v2.x / norm(v2), y: v2.y / norm(v2), z: v2.z / norm(v2) };
      const bis = { x: u1.x + u2.x, y: u1.y + u2.y, z: u1.z + u2.z };
      // for a linear arrangement the bisector vanishes, so offset the label perpendicular to the bond
      let dir = bis, bl = norm(bis);
      if (bl < 1e-6) {
        dir = { x: -u1.y, y: u1.x, z: 0 };
        bl = norm(dir);
        if (bl < 1e-6) { dir = { x: 1, y: 0, z: 0 }; bl = 1; }
      }
      viewer.addLabel(deg.toFixed(1) + "°", {
        position: { x: b.x + 0.8 * dir.x / bl, y: b.y + 0.8 * dir.y / bl, z: b.z + 0.8 * dir.z / bl },
        backgroundColor: "black",
        backgroundOpacity: 0.7,
        fontColor: "yellow",
        fontSize: LABEL_FONT,
        bold: true
      });
      setReadout(a.elem + "–" + b.elem + "–" + c.elem + " angle = " + deg.toFixed(1) + "°   (" +
        a.elem + "–" + b.elem + " " + (100 * norm(v1)).toFixed(1) + " pm, " +
        b.elem + "–" + c.elem + " " + (100 * norm(v2)).toFixed(1) + " pm)", false);
    }
    viewer.render();
  }

  function onAtomClick(atom) {
    const i = picked.findIndex(function (p) { return p.index === atom.index; });
    if (i !== -1) {
      picked.splice(i, 1);                 // clicked a selected atom: deselect it
    } else {
      if (picked.length === 3) picked = []; // a fourth click starts a fresh measurement
      picked.push(atom);
    }
    redraw();
  }

  window.addEventListener("DOMContentLoaded", function () {
    viewer = $3Dmol.createViewer("viewer", { backgroundColor: "#0e1210" });
    viewer.addModel(xyz, "xyz");
    applyStyles();
    viewer.setClickable({}, true, onAtomClick);
    drawLonePair();
    viewer.zoomTo();
    viewer.render();

    document.getElementById("clearBtn").addEventListener("click", clearMeasurement);

    window.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key && e.key.toLowerCase() === LONE_PAIR_KEY) {
        showLonePair = !showLonePair;
        redraw();
      }
    });
  });
</script>
</body>
</html>
